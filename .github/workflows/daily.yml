name: Pembaruan harian The Signal

# GitHub cron memakai UTC. Daftar jam di bawah = 06.00 sampai 22.00 WIB,
# tiap 2 jam. Jadwal cron GitHub sering telat beberapa menit sampai belasan
# menit, itu wajar.
#
# Job ini pemilik articles.js dan videos.js. Data pasar BUKAN urusannya,
# itu milik pasar.yml, supaya tidak ada dua job yang menulis berkas sama.
on:
  schedule:
    # Tiap 2 jam pukul 06.00-22.00 WIB, bukan sekali sehari.
    #
    # Sebelumnya cuma 06.00 WIB dan itu keliru: pada jam itu tvOneNews belum
    # menerbitkan berita hari ini, jadi yang terambil selalu berita kemarin.
    # Terbukti 2026-08-12: job jalan 06.49, sementara "Rupiah Menguat ke
    # Rp17.848" terbit 09.24 dan baru akan terambil besok pagi, telat 24 jam.
    - cron: "0 23,1,3,5,7,9,11,13,15 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Berapa berita baru yang dikejar run ini"
        default: "10"
      model:
        description: "Model Claude yang dipakai"
        default: "claude-sonnet-5"

concurrency:
  group: the-signal-tulis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  perbarui:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Pasang dependensi
        run: npm ci

      - name: Ambil berita, video, dan data pasar
        env:
          # Mesin AI: pakai token langganan Claude (tanpa biaya API tambahan).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Alternatif kalau nanti mau pindah ke API berbayar:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # WebAPI BPS untuk Berita Resmi Statistik. Tanpa ini kanal BPS
          # dilewati diam-diam dan sumber pemerintah lain tetap jalan.
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
          SIGNAL_TARGET: ${{ inputs.target || '10' }}
          SIGNAL_MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
        run: npm run update

      - name: Ambil foto asli dari sumber
        run: |
          # Menutup celah yang terbukti nyata. Log putaran 13 Agustus 2026 pukul
          # 06.18 berbunyi "0 foto asli diunduh, 0 ilustrasi dibuat, 7 tanpa
          # adegan": artikel baru terbit memakai ilustrasi, lalu baru dapat foto
          # aslinya ketika seseorang menjalankan pengambil foto secara manual.
          # Artinya pembaca yang datang lebih dulu melihat versi yang salah.
          #
          # Langkah ini menelusuri halaman sumber tiap artikel yang belum punya
          # foto asli dan memasangnya. TIDAK butuh pembuat ilustrasi, cuma curl
          # dan ffmpeg, jadi bisa jalan di runner GitHub. Gratis, tanpa model.
          #
          # Dibatasi 30 supaya satu putaran tidak kepanjangan; sisanya menyusul
          # di putaran berikutnya. Kegagalan tidak boleh menjatuhkan pembaruan
          # yang isinya sudah benar, jadi errornya ditelan.
          node scripts/ganti-foto-asli.mjs 30 || echo "pengambilan foto gagal, artikel tetap terbit dengan ilustrasi"

      - name: Periksa hasil sebelum commit
        id: periksa
        run: |
          JML=$(node -e "const fs=require('fs');const s=fs.readFileSync('assets/js/articles.js','utf8');const a=JSON.parse(s.slice(s.indexOf('['),s.lastIndexOf(']')+1));console.log(a.length)")
          echo "artikel=$JML" >> $GITHUB_OUTPUT
          echo "Total artikel: $JML"
          # Jaring pengaman: jangan pernah commit kalau arsip mendadak kosong
          if [ "$JML" -lt 10 ]; then
            echo "::error::Arsip cuma $JML artikel. Dibatalkan supaya situs tidak jadi kosong."
            exit 1
          fi
          if [ ! -f berita/index.html ] && [ -z "$(ls -A berita 2>/dev/null)" ]; then
            echo "::error::Folder berita/ kosong, build gagal."
            exit 1
          fi

      - name: Commit dan push
        id: kirim
        run: |
          git config user.name "the-signal-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan hari ini."
            echo "berubah=tidak" >> "$GITHUB_OUTPUT"
          else
            git pull --rebase --autostash origin master || true
            git commit -m "Pembaruan otomatis: ${{ steps.periksa.outputs.artikel }} artikel ($(date -u +%Y-%m-%d))"
            git push
            echo "berubah=ya" >> "$GITHUB_OUTPUT"
            node -e "const fs=require('fs');const s=fs.readFileSync('assets/js/articles.js','utf8');const a=JSON.parse(s.slice(s.indexOf('['),s.lastIndexOf(']')+1));console.log('slug='+a[0].slug)" >> "$GITHUB_OUTPUT"
          fi

      # Push sukses TIDAK sama dengan situs terbarui. Terbukti 2026-08-10:
      # satu push tidak memicu webhook Vercel sama sekali, git hijau tapi
      # halamannya 404. Tanpa langkah ini kegagalan seperti itu lolos jadi
      # "sukses" dan situs diam-diam berhenti terbarui.
      #
      # Runner tidak punya kredensial Vercel, jadi di sini kita hanya
      # MEMBUKTIKAN dan menggagalkan workflow kalau tidak terbit. Deploy
      # ulangnya dilakukan manual atau lewat jalankan-idx.ps1 yang memang
      # sudah terautentikasi di mesin lokal.
      - name: Pastikan benar-benar terbit
        if: steps.kirim.outputs.berubah == 'ya'
        run: |
          # Alamat diambil dari situs.mjs, satu-satunya tempat yang menuliskannya.
          SITUS=$(node -e "import('./scripts/situs.mjs').then(m=>console.log(m.SITUS))")
          URL="$SITUS/berita/${{ steps.kirim.outputs.slug }}.html"
          echo "menunggu: $URL"
          for i in $(seq 1 20); do
            KODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || echo 000)
            if [ "$KODE" = "200" ]; then
              echo "terbit setelah ~$((i*15)) detik"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Push sukses tapi $URL masih belum bisa diakses setelah 5 menit."
          echo "::error::Vercel kemungkinan tidak menerima webhook. Jalankan: npx vercel deploy --prod"
          exit 1

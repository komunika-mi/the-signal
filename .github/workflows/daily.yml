name: Pembaruan harian The Signal

# GitHub cron memakai UTC. Daftar jam di bawah = 06.00 sampai 22.00 WIB,
# tiap 2 jam. Jadwal cron GitHub sering telat beberapa menit sampai belasan
# menit, itu wajar.
#
# Job ini pemilik articles.js dan videos.js. Data pasar BUKAN urusannya,
# itu milik pasar.yml, supaya tidak ada dua job yang menulis berkas sama.
on:
  schedule:
    # Tiap 2 jam pukul 06.00-22.00 WIB, bukan sekali sehari.
    #
    # Sebelumnya cuma 06.00 WIB dan itu keliru: pada jam itu tvOneNews belum
    # menerbitkan berita hari ini, jadi yang terambil selalu berita kemarin.
    # Terbukti 2026-08-12: job jalan 06.49, sementara "Rupiah Menguat ke
    # Rp17.848" terbit 09.24 dan baru akan terambil besok pagi, telat 24 jam.
    - cron: "0 23,1,3,5,7,9,11,13,15 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Berapa berita baru yang dikejar run ini"
        default: "10"
      model:
        description: "Model Claude yang dipakai"
        default: "claude-sonnet-5"

concurrency:
  group: the-signal-tulis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  perbarui:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Pasang dependensi
        run: npm ci

      - name: Kirim artikel rilis BPS ke Telegram
        # SENGAJA DI AWAL putaran, bukan setelah artikelnya ditulis: pesan
        # kanal tidak bisa menunggu deploy Vercel, jadi yang dikirim adalah
        # artikel rilis BPS dari putaran SEBELUMNYA yang kini sudah tayang
        # (skripnya memeriksa 200 dulu). Telat maksimal dua jam, tidak pernah
        # menautkan halaman yang belum ada.
        #
        # STATE ANTI-GANDA DI-COMMIT DI SINI JUGA, bukan menumpang commit
        # rutin di akhir. Versi awal menumpang, dan verifikator membuktikan
        # celahnya dengan simulasi: ada tujuh langkah lain yang bisa gagal di
        # antara kirim dan commit, dan jalur konflik rebase malah me-reset
        # workspace ke origin, jadi pesan yang SUDAH terkirim kehilangan
        # catatannya dan putaran dua jam berikutnya mengirim ulang pesan yang
        # sama ke seluruh kanal. Pesan kanal tidak bisa ditarik; catatan
        # kirimnya harus aman sebelum langkah lain diberi kesempatan gagal.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          node scripts/kirim-telegram.mjs --artikel-bps
          if ! git diff --quiet scripts/telegram-kirim.json; then
            git config user.name "the-signal-bot"
            git config user.email "actions@github.com"
            git add scripts/telegram-kirim.json
            git commit -m "Catat kiriman Telegram artikel BPS"
            git pull --rebase --autostash origin master || {
              git rebase --abort 2>/dev/null || true
              echo "::error::Rebase bentrok saat mencatat state Telegram."
              exit 1
            }
            git push
          fi

      - name: Pasang ffmpeg
        run: |
          # WAJIB untuk mengunduh foto asli dari sumber. unduhFoto memakai
          # ffmpeg mengecilkan gambar ke 680px, dan ffmpeg TIDAK tersedia di
          # runner ubuntu-latest.
          #
          # Selama ini gagal diam-diam: tiap putaran cloud mencatat "unduh
          # gagal: spawnSync ffmpeg ENOENT" lalu artikel jatuh ke ilustrasi AI,
          # sehingga foto asli hanya pernah terpasang ketika pipeline
          # dijalankan dari komputer rumah. Komentar di foto-artikel.mjs
          # bahkan menyatakan sebaliknya, bahwa unduhan "cuma butuh curl dan
          # ffmpeg, jadi bisa jalan di runner GitHub". Bagian curl-nya benar,
          # bagian ffmpeg-nya tidak pernah diperiksa. Ketahuan 13 Agustus 2026
          # saat membaca log putaran yang gagal karena sebab lain.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          # ffprobe ikut paket ffmpeg, tapi diperiksa sendiri karena sejak
          # 14 Agustus 2026 penyaring ukuran gambar bergantung padanya.
          ffprobe -version | head -1

      - name: Ambil berita, video, dan data pasar
        env:
          # Mesin AI: pakai token langganan Claude (tanpa biaya API tambahan).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Alternatif kalau nanti mau pindah ke API berbayar:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # WebAPI BPS untuk Berita Resmi Statistik. Tanpa ini kanal BPS
          # dilewati diam-diam dan sumber pemerintah lain tetap jalan.
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
          SIGNAL_TARGET: ${{ inputs.target || '10' }}
          SIGNAL_MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
        run: npm run update

      - name: Ambil foto asli dari sumber
        run: |
          # Menutup celah yang terbukti nyata. Log putaran 13 Agustus 2026 pukul
          # 06.18 berbunyi "0 foto asli diunduh, 0 ilustrasi dibuat, 7 tanpa
          # adegan": artikel baru terbit memakai ilustrasi, lalu baru dapat foto
          # aslinya ketika seseorang menjalankan pengambil foto secara manual.
          # Artinya pembaca yang datang lebih dulu melihat versi yang salah.
          #
          # Langkah ini menelusuri halaman sumber tiap artikel yang belum punya
          # foto asli dan memasangnya. TIDAK butuh pembuat ilustrasi, cuma curl
          # dan ffmpeg, jadi bisa jalan di runner GitHub. Gratis, tanpa model.
          #
          # Dibatasi 30 supaya satu putaran tidak kepanjangan; sisanya menyusul
          # di putaran berikutnya. Kegagalan tidak boleh menjatuhkan pembaruan
          # yang isinya sudah benar, jadi errornya ditelan.
          node scripts/ganti-foto-asli.mjs 30 || echo "pengambilan foto gagal, artikel tetap terbit dengan ilustrasi"

          # Jaring pengaman: kembalikan gambar terlacak yang terhapus.
          #
          # Penyebab utamanya sudah diperbaiki di foto-unik.mjs (gambar lama
          # kini dicadangkan sebelum diganti), tapi lapis ini murah dan menutup
          # seluruh kelas masalahnya: apa pun yang menghapus berkas gambar yang
          # sudah pernah di-commit, isinya masih ada di git dan bisa dipulihkan
          # persis. Tanpa ini, satu berkas hilang menggagalkan build dan
          # MENAHAN SELURUH BERITA BARU, yang terjadi 13 Agustus 2026.
          HILANG=$(git ls-files --deleted -- assets/img | wc -l)
          if [ "$HILANG" -gt 0 ]; then
            echo "::warning::$HILANG gambar terlacak terhapus, dipulihkan dari git"
            git ls-files --deleted -z -- assets/img | xargs -0 -r git checkout --
          fi

      - name: Perbarui angka BPS dan tulis artikel rilis
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
          # WAJIB: langkah ini menulis artikel saat ada rilis baru, jadi
          # memanggil model. Tanpa token, penarikan angkanya tetap jalan tapi
          # artikelnya gagal ditulis dan rilis itu terlewat diam-diam.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIGNAL_MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
        run: |
          # Menarik deret waktu 10 indikator ekonomi dari WebAPI BPS untuk
          # grafik di artikel dan halaman /data-ekonomi.html, SEKALIGUS
          # menerbitkan artikel tiap kali ada angka periode baru.
          #
          # Kegagalan ditelan dan skripnya sengaja tidak menulis berkas kosong.
          # Kalau WebAPI bermasalah, angka kemarin jauh lebih berguna daripada
          # halaman tanpa angka sama sekali; build tetap dijalankan supaya
          # berita yang sudah terkumpul di langkah sebelumnya tetap terbit.
          #
          # bps-artikel.mjs melakukan tiga hal sekaligus: menarik angka,
          # membandingkannya dengan yang tersimpan, dan MENULIS ARTIKEL untuk
          # tiap indikator yang periodenya maju. Deteksinya tanpa berkas status
          # tambahan, bps.js sendiri yang jadi penandanya, jadi harus dijalankan
          # sebelum ada yang menimpa berkas itu.
          #
          # Panggilan model hanya terjadi kalau BPS benar-benar merilis, sekitar
          # delapan kali sebulan dari 10 indikator. Di hari biasa skrip ini cuma
          # menarik angka dan membangun ulang halaman.
          node scripts/bps-artikel.mjs || {
            echo "BPS gagal, angka lama dipertahankan"
            node scripts/build-pages.mjs
          }

      - name: Periksa foto terhadap sumbernya
        run: |
          # Pemeriksaan yang selama ini DIKERJAKAN MANUSIA.
          #
          # Penjaga foto lain memeriksa konsistensi internal: nama berkas cocok
          # dengan slug, berkasnya ada, tidak ada dua artikel bergambar identik.
          # Semuanya bisa lolos sempurna sementara fotonya tetap salah, karena
          # tidak satu pun benar-benar melihat ke halaman sumbernya.
          #
          # Selama ini yang menemukan foto keliru adalah pemilik situs, dengan
          # membuka artikel dan sumbernya berdampingan lalu membandingkan
          # dengan mata. Tiga kali dalam satu hari pada 13 Agustus 2026.
          # Langkah ini mengerjakan pembandingan itu, memakai sidik jari
          # perseptual karena berkas kita sudah diperkecil sehingga byte-nya
          # tidak mungkin sama persis dengan berkas di server sumber.
          #
          # PERINGATAN, bukan penghenti. Menahan seluruh berita demi satu foto
          # terlalu mahal, dan itu pelajaran mahal dari hari yang sama ketika
          # penjaga keras menahan situs seharian. Yang tidak cocok dilaporkan
          # di ringkasan run supaya bisa diperbaiki, bukan disembunyikan.
          node scripts/periksa-foto.mjs 25 || echo "::warning::Ada foto yang tidak cocok dengan sumbernya, lihat log langkah ini"

      - name: Periksa kesegaran tiap kanal
        run: |
          # Menjawab pertanyaan yang tidak bisa dijawab satu putaran: apakah
          # kanal ini sepi, atau rusak?
          #
          # Dua kali dalam dua hari sebuah kanal mati diam-diam dan yang
          # menyadarinya pemilik situs, bukan sistemnya. Keduanya berbentuk sama:
          # pekerjaan gagal, tapi kegagalannya terbaca sebagai "tidak ada yang
          # baru", dan itu keadaan yang SAH untuk media. Yang membedakan sepi
          # dari rusak cuma waktu, dan waktu itu yang diukur di sini.
          #
          # Peringatan, bukan penghenti: kanal basi tidak boleh menahan berita
          # kanal lain yang sehat.
          node scripts/periksa-kanal.mjs || echo "::warning::Ada kanal yang berhenti berbunyi, lihat log langkah ini"

      - name: Periksa hasil sebelum commit
        id: periksa
        run: |
          JML=$(node -e "const fs=require('fs');const s=fs.readFileSync('assets/js/articles.js','utf8');const a=JSON.parse(s.slice(s.indexOf('['),s.lastIndexOf(']')+1));console.log(a.length)")
          echo "artikel=$JML" >> $GITHUB_OUTPUT
          echo "Total artikel: $JML"
          # Jaring pengaman: jangan pernah commit kalau arsip mendadak kosong
          if [ "$JML" -lt 10 ]; then
            echo "::error::Arsip cuma $JML artikel. Dibatalkan supaya situs tidak jadi kosong."
            exit 1
          fi
          if [ ! -f berita/index.html ] && [ -z "$(ls -A berita 2>/dev/null)" ]; then
            echo "::error::Folder berita/ kosong, build gagal."
            exit 1
          fi

      - name: Commit dan push
        id: kirim
        run: |
          git config user.name "the-signal-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan hari ini."
            echo "berubah=tidak" >> "$GITHUB_OUTPUT"
          else
            # Konflik JANGAN ditelan. Pola lama di sini `|| true` membuat
            # rebase yang bentrok tetap dianggap sukses, lalu langkah commit
            # berikutnya berhenti dengan "Committing is not possible because
            # you have unmerged files" dan seluruh putaran gagal dengan pesan
            # yang tidak menunjuk sebabnya. Terjadi pada run pasar 13 Agustus
            # 2026 pukul 10.59 UTC, keluar dengan kode 128.
            #
            # Yang benar: batalkan rebase, samakan paksa dengan remote, lalu
            # berhenti. Berkas yang dihasilkan putaran ini memang hilang, tapi
            # semuanya bisa dibuat ulang pada putaran berikutnya, sedangkan
            # repo yang setengah ter-rebase harus dibereskan tangan.
            git pull --rebase --autostash origin master || {
              echo "::error::Rebase bentrok dengan remote. Putaran ini dibatalkan; putaran berikutnya akan membuat ulang."
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/master
              exit 1
            }
            git commit -m "Pembaruan otomatis: ${{ steps.periksa.outputs.artikel }} artikel ($(date -u +%Y-%m-%d))"
            git push
            echo "berubah=ya" >> "$GITHUB_OUTPUT"
            node -e "const fs=require('fs');const s=fs.readFileSync('assets/js/articles.js','utf8');const a=JSON.parse(s.slice(s.indexOf('['),s.lastIndexOf(']')+1));console.log('slug='+a[0].slug)" >> "$GITHUB_OUTPUT"
          fi

      # Push sukses TIDAK sama dengan situs terbarui. Terbukti 2026-08-10:
      # satu push tidak memicu webhook Vercel sama sekali, git hijau tapi
      # halamannya 404. Tanpa langkah ini kegagalan seperti itu lolos jadi
      # "sukses" dan situs diam-diam berhenti terbarui.
      #
      # Runner tidak punya kredensial Vercel, jadi di sini kita hanya
      # MEMBUKTIKAN dan menggagalkan workflow kalau tidak terbit. Deploy
      # ulangnya dilakukan manual atau lewat jalankan-idx.ps1 yang memang
      # sudah terautentikasi di mesin lokal.
      - name: Pastikan benar-benar terbit
        if: steps.kirim.outputs.berubah == 'ya'
        run: |
          # Alamat diambil dari situs.mjs, satu-satunya tempat yang menuliskannya.
          SITUS=$(node -e "import('./scripts/situs.mjs').then(m=>console.log(m.SITUS))")
          URL="$SITUS/berita/${{ steps.kirim.outputs.slug }}.html"
          echo "menunggu: $URL"
          for i in $(seq 1 20); do
            KODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || echo 000)
            if [ "$KODE" = "200" ]; then
              echo "terbit setelah ~$((i*15)) detik"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Push sukses tapi $URL masih belum bisa diakses setelah 5 menit."
          echo "::error::Vercel kemungkinan tidak menerima webhook. Jalankan: npx vercel deploy --prod"
          exit 1

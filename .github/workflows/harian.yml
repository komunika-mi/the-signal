name: Signal Harian

# Produk berlangganan The Signal: satu tulisan sehari yang merangkai berita
# hari itu jadi benang arah kebijakan.
#
# JAM MALAM, DAN ITU DISENGAJA. Bahannya berita hari berjalan, jadi kalau
# dijalankan pagi yang terangkai cuma berita kemarin. Sempat pukul 17.00 dan
# itu terbukti kurang: daily.yml masih menambah artikel sampai 22.56 WIB, dan
# edisi 13 Agustus 2026 terangkai dari 12 artikel padahal hari itu terbit 19.
#
# HARI KERJA SAJA, karena janji di formulir pendaftaran berbunyi "tiap hari
# kerja". Sabtu dan Minggu bursa tutup dan lembaga tidak menerbitkan apa pun,
# jadi bahannya memang tidak ada.
#
# PENGIRIMAN KE PELANGGAN DILAKUKAN DI SINI, lihat langkah terakhir.
#
# Komentar lama di tempat ini menyatakan sebaliknya, bahwa Buttondown memantau
# feed lalu mengirim sendiri. Itu tidak pernah benar: fitur RSS-to-email
# Buttondown berbayar, jadi pengiriman memang dikerjakan scripts/kirim-harian.mjs
# lewat API. Catatan yang salah itu bertahan sampai 14 Agustus 2026 dan sempat
# menyesatkan diagnosis ketika newsletter ternyata tidak pernah mengirim
# apa pun. Komentar yang keliru lebih berbahaya daripada tidak ada komentar.
# JAM GANJIL, DAN ITU PENTING. daily.yml jalan tiap jam GENAP 06.00-22.00 WIB,
# dan Task Scheduler IDX di komputer rumah juga tiap jam GENAP 06.00-20.00.
# Ketiganya menulis repo yang sama. Grup concurrency GitHub hanya mengatur
# sesama workflow Actions, tidak menyentuh penjadwal lokal, jadi kalau harian
# ikut jam genap salah satu push pasti ditolak dan edisinya batal terbit.
# 17.00 WIB tidak ditempati siapa pun.
on:
  schedule:
    # 21.00 WIB, Senin-Jumat. DIGESER dari 17.00 pada 14 Agustus 2026.
    #
    # Pada 17.00 mesin berita masih bekerja sampai 22.56 WIB, jadi Signal
    # Harian dirangkai dari bahan yang belum lengkap. Terukur pada edisi
    # 13 Agustus: dirangkai dari 12 artikel padahal hari itu terbit 19, jadi
    # 7 artikel atau 37 persen bahan tidak pernah ikut dibaca. Yang terlewat
    # bukan berita sepele, termasuk empat rilis ESDM soal harga minyak dan
    # batu bara acuan.
    #
    # Produk ini menjual pembacaan arah SEHARIAN. Merangkai pukul lima sore
    # berarti membaca dua pertiga hari lalu menyebutnya kesimpulan hari itu.
    # Konsekuensinya email tiba malam, dan itu justru cocok: pembacanya
    # pengambil keputusan yang menyiapkan langkah besok pagi.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

concurrency:
  group: the-signal-tulis       # sama dengan daily.yml dan idx.yml, jangan bentrok menulis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tulis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Pasang dependensi
        run: npm ci

      - name: Tulis Signal Harian
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIGNAL_MODEL: claude-sonnet-5
        run: node scripts/signal-harian.mjs

      - name: Tagih Rapor Sinyal
        # Rapor itu pelengkap edisi: mencatat klaim edisi baru ke buku rapor
        # dan menilai klaim lama yang penanda ujinya jatuh tempo. Kalau
        # langkah ini gagal, edisi malam ini TETAP harus terbit, karena itu
        # continue-on-error: kegagalannya terlihat sebagai langkah merah di
        # ringkasan run, tapi tidak membatalkan penerbitan.
        #
        # build-pages diulang setelahnya karena rapor.html dirender dari
        # rapor.js, dan build di dalam signal-harian.mjs berjalan SEBELUM
        # buku rapornya diperbarui.
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIGNAL_MODEL: claude-sonnet-5
        run: |
          node scripts/rapor-tagih.mjs
          node scripts/build-pages.mjs

      - name: Commit dan push
        run: |
          git config user.name "the-signal-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan. Bahan hari ini kemungkinan terlalu sedikit,"
            echo "atau editor menilai tidak ada benang yang cukup jelas. Itu wajar,"
            echo "lebih baik tidak terbit daripada memaksakan tulisan hampa."
            # Penanda untuk langkah-langkah di bawah supaya hari sah tanpa
            # edisi berakhir HIJAU. Sebelumnya jalur ini membiarkan EDISI
            # kosong sehingga langkah penjaga tayang exit 1, dan run merah
            # berbunyi "EDISI kosong" padahal tidak ada yang rusak. Aturan
            # rumah tangganya jelas (lihat pemantau.yml): satu-satunya
            # workflow yang boleh merah tanpa kerusakan adalah pemantau.
            # Merah palsu melatih pemilik mengabaikan notifikasi merah.
            echo "TERBIT=tidak" >> $GITHUB_ENV
            exit 0
          fi
          echo "TERBIT=ya" >> $GITHUB_ENV
          EDISI=$(node -e "const fs=require('fs');const m=fs.readFileSync('assets/js/harian.js','utf8').match(/\"tanggal\":\s*\"([^\"]+)\"/);console.log(m?m[1]:'')")
          # Diteruskan lewat GITHUB_ENV karena variabel shell TIDAK menyeberang
          # antar langkah, dan langkah penjaga di bawah memerlukannya untuk
          # memastikan yang tayang benar edisi hari ini.
          echo "EDISI=$EDISI" >> $GITHUB_ENV
          git commit -m "Signal Harian $EDISI"
          # Rebase dulu, karena workflow lain (daily, pasar) bisa saja mendorong
          # commit di sela penulisan edisi. Tanpa ini push ditolak non-fast-forward
          # dan edisi hari itu batal terbit padahal tulisannya sudah jadi.
          # Konflik tidak ditelan: kalau rebase bentrok, putaran berhenti dengan
          # jelas dan edisinya bisa dijalankan ulang lewat workflow_dispatch.
          git pull --rebase --autostash origin master || {
            echo "::error::Rebase bentrok. Jalankan ulang workflow ini setelah putaran lain selesai."
            git rebase --abort 2>/dev/null || true
            exit 1
          }
          # JANGAN PERCAYA KODE KELUAR `git pull` DI ATAS.
          #
          # Kalau yang bentrok adalah AUTOSTASH-nya, git tetap keluar dengan kode 0.
          # Diuji sendiri pada repo kecil: "Applying autostash resulted in conflicts",
          # `git ls-files -u` berisi 3 berkas, dan kode keluar git pull tetap 0. Jadi
          # blok `|| { ... }` di atas TIDAK PERNAH menyala untuk kasus ini.
          #
          # Terjadi sungguhan 19 Agustus 2026 pada run 32240199637: log memuat
          # "Applying autostash resulted in conflicts" lalu "Committing is not
          # possible because you have unmerged files" dan keluar 128, sementara baris
          # "::error::Rebase bentrok dengan remote" yang disiapkan penjaga itu tidak
          # pernah tercetak.
          #
          # Yang diperiksa di sini KEADAAN pohon kerjanya, bukan kode keluarnya.
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Autostash bentrok saat rebase. Putaran ini dibatalkan; putaran berikutnya akan membuat ulang."
            git ls-files -u | awk '{print $4}' | sort -u | head -20
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/master
            exit 1
          fi
          git push

      - name: Tunggu situs benar-benar tayang
        run: |
          # HARUS sebelum pengiriman, bukan sesudah. Email memuat tautan "baca
          # di situs", dan email tidak bisa ditarik kembali. Kalau dikirim
          # sementara deploy belum selesai, pelanggan mengklik tautan menuju
          # halaman yang belum ada, dan kesan pertama itu tidak bisa diperbaiki.
          #
          # Kalau situs tidak kunjung tayang, workflow sengaja digagalkan
          # sebelum satu pun email keluar.
          if [ "$TERBIT" = "tidak" ]; then
            echo "Tidak ada edisi hari ini, tidak ada yang perlu ditunggu. Selesai hijau."
            exit 0
          fi
          if [ -z "$EDISI" ]; then
            echo "::error::EDISI kosong padahal ada edisi yang di-commit. Ini baru kejanggalan sungguhan."
            exit 1
          fi
          for i in $(seq 1 20); do
            sleep 15
            # Diperiksa EDISI HARI INI, bukan sekadar ada item apa pun.
            # feed.xml sudah berisi item dari edisi sebelumnya, jadi pengujian
            # lama lulus tanpa peduli edisi hari ini sudah tayang atau belum.
            # Gerbang yang selalu terbuka sama saja dengan tidak ada gerbang,
            # dan akibatnya email bisa terkirim menunjuk halaman yang belum
            # memuat edisinya.
            if curl -sf --max-time 20 https://the-signal.id/feed.xml | grep -q "the-signal-harian-$EDISI"; then
              echo "Situs dan feed sudah tayang."
              exit 0
            fi
          done
          echo "GAGAL: situs tidak tayang setelah 5 menit."
          echo "Pengiriman dibatalkan supaya tidak ada email berisi tautan mati."
          exit 1

      - name: Kirim ke pelanggan
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          # Langkah terakhir, dan satu-satunya yang tidak bisa dibatalkan.
          #
          # Skrip menolak mengirim kalau edisi tanggal itu sudah pernah dibuat,
          # jadi menjalankan ulang workflow tidak berarti pelanggan menerima
          # dua email. Penjaga itu diuji: percobaan kedua berhenti sendiri.
          if [ "$TERBIT" = "tidak" ]; then
            echo "Tidak ada edisi hari ini, tidak ada email yang dikirim."
            exit 0
          fi
          node scripts/kirim-harian.mjs

      - name: Kirim ke kanal Telegram
        # Corong distribusi kedua. Tanpa secret TELEGRAM_* skripnya keluar 0
        # sambil mencatat bahwa kanalnya belum aktif, jadi langkah ini aman
        # ada sebelum kanalnya sendiri dibuat.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          if [ "$TERBIT" = "tidak" ]; then
            echo "Tidak ada edisi hari ini, tidak ada kiriman Telegram."
            exit 0
          fi
          node scripts/kirim-telegram.mjs --harian
          # State anti-kirim-ganda hidup di repo. Tanpa commit ini, checkout
          # segar putaran besok tidak tahu edisi ini sudah terkirim dan
          # seluruh pelanggan kanal menerima kiriman dobel.
          if ! git diff --quiet scripts/telegram-kirim.json; then
            git config user.name "the-signal-bot"
            git config user.email "actions@github.com"
            git add scripts/telegram-kirim.json
            git commit -m "Catat kiriman Telegram edisi $EDISI"
            git pull --rebase --autostash origin master || {
              git rebase --abort 2>/dev/null || true
              echo "::error::Rebase bentrok saat mencatat state Telegram."
              exit 1
            }
            # JANGAN PERCAYA KODE KELUAR `git pull` DI ATAS.
            #
            # Kalau yang bentrok adalah AUTOSTASH-nya, git tetap keluar dengan kode 0.
            # Diuji sendiri pada repo kecil: "Applying autostash resulted in conflicts",
            # `git ls-files -u` berisi 3 berkas, dan kode keluar git pull tetap 0. Jadi
            # blok `|| { ... }` di atas TIDAK PERNAH menyala untuk kasus ini.
            #
            # Terjadi sungguhan 19 Agustus 2026 pada run 32240199637: log memuat
            # "Applying autostash resulted in conflicts" lalu "Committing is not
            # possible because you have unmerged files" dan keluar 128, sementara baris
            # "::error::Rebase bentrok dengan remote" yang disiapkan penjaga itu tidak
            # pernah tercetak.
            #
            # Yang diperiksa di sini KEADAAN pohon kerjanya, bukan kode keluarnya.
            if [ -n "$(git ls-files -u)" ]; then
              echo "::error::Autostash bentrok saat rebase. Putaran ini dibatalkan; putaran berikutnya akan membuat ulang."
              git ls-files -u | awk '{print $4}' | sort -u | head -20
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/master
              exit 1
            fi
            git push
          fi

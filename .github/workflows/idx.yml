name: Keterbukaan informasi IDX

# Tiap 2 jam pada jam aktif bursa, 06.00 sampai 20.00 WIB.
# GitHub cron memakai UTC, WIB = UTC+7, jadi:
#   06 WIB = 23 UTC (hari sebelumnya)   14 WIB = 07 UTC
#   08 WIB = 01 UTC                     16 WIB = 09 UTC
#   10 WIB = 03 UTC                     18 WIB = 11 UTC
#   12 WIB = 05 UTC                     20 WIB = 13 UTC
# Jadwal cron GitHub sering telat beberapa menit. Itu wajar dan tidak masalah
# karena tiap putaran melewati laporan yang sudah pernah diberitakan.
on:
  # JADWAL HIDUP LAGI SEJAK 19 AGUSTUS 2026.
  #
  # Sebelumnya dimatikan karena www.idx.co.id memblokir IP pusat data:
  # dari runner selalu dibalas halaman tantangan Cloudflare, dari koneksi
  # rumahan berhasil. Pipeline ini karena itu terpaksa jalan dari laptop
  # pemilik lewat Task Scheduler, dan 170 dari 400 artikel situs hanya
  # bertambah kalau laptopnya menyala.
  #
  # Yang berubah: pengambilan dipindah ke www.idx.id, domain kedua yang
  # menyajikan API sama persis dan TIDAK memasang tantangan itu. Diuji dari
  # runner ini juga (probe-idx.yml, 19 Agu 2026): idx.co.id HTTP 403 4.544
  # byte, idx.id HTTP 200 dengan ResultCount identik.
  #
  # URL yang disimpan dan disitir tetap www.idx.co.id, lihat penjelasan
  # panjang di scripts/fetch-idx.mjs.
  schedule:
    - cron: "0 23,1,3,5,7,9,11,13 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Berapa aksi korporasi diberitakan putaran ini"
        default: "8"
      kandidat:
        description: "Berapa laporan diperiksa"
        default: "25"

concurrency:
  group: the-signal-tulis      # tidak boleh bentrok dengan pembaruan harian
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  perbarui:
    runs-on: ubuntu-latest
    # 40 menit, naik dari 30. Pagar per langkah berjumlah 33 (5 npm + 6 alat
    # + 22 ambil), jadi jatah 30 akan menyala LEBIH DULU daripada pagar
    # langkahnya, dan itu persis keadaan yang ingin dihindari: job yang
    # ditebas berakhir "cancelled" tanpa email, sedangkan langkah yang
    # ditebas berakhir "failure" yang mengirim email.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Pasang dependensi
        timeout-minutes: 5
        run: npm ci

      # Alat baca dokumen, yang selama ini TIDAK PERNAH dipasang di sini.
      #
      # fetch-idx.mjs memanggil wajibAlat('pdftotext') untuk membaca lampiran
      # PDF, dan itu MELEMPAR kalau alatnya tidak ada. tesseract dan pdftoppm
      # dipakai untuk PDF hasil pindaian lewat punyaAlat(), yang diam-diam
      # melewatinya kalau tidak ada. Jadi tanpa langkah ini sebagian laporan
      # gagal keras dan sebagian lagi turun kelas tanpa suara.
      #
      # tesseract-ocr-ind dipasang juga: dokumen keterbukaan informasi
      # berbahasa Indonesia, dan OCR tanpa data bahasanya menghasilkan teks
      # yang lebih buruk daripada tidak sama sekali.
      #
      # apt-get update tidak dijalankan lebih dulu. Ia menarik seluruh indeks
      # repositori demi tiga paket, dan di daily.yml pernah memakan 24 menit 55
      # detik sampai menembus jatah job.
      - name: Pasang alat baca dokumen
        timeout-minutes: 6
        run: |
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ind || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ind; }
          pdftotext -v
          tesseract --version | head -1
          ls /usr/share/tesseract-ocr/*/tessdata/ind.traineddata

      - name: Ambil keterbukaan informasi IDX
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IDX_TARGET: ${{ inputs.target || '8' }}
          IDX_KANDIDAT: ${{ inputs.kandidat || '25' }}
          SIGNAL_MODEL: claude-sonnet-5
        # Dipagari sendiri supaya kalau ia menggantung, yang mati langkahnya
        # dan run jadi MERAH (pemilik dapat email), bukan seluruh job yang
        # ditebas jatah waktunya dan berakhir "cancelled" tanpa kabar.
        timeout-minutes: 22
        run: npm run update:idx

      - name: Periksa hasil sebelum commit
        id: periksa
        run: |
          JML=$(node -e "const fs=require('fs');const s=fs.readFileSync('assets/js/articles.js','utf8');const a=JSON.parse(s.slice(s.indexOf('['),s.lastIndexOf(']')+1));console.log(a.length)")
          echo "artikel=$JML" >> $GITHUB_OUTPUT
          echo "Total artikel: $JML"
          if [ "$JML" -lt 10 ]; then
            echo "::error::Arsip cuma $JML artikel. Dibatalkan supaya situs tidak jadi kosong."
            exit 1
          fi

      - name: Commit dan push
        run: |
          git config user.name "the-signal-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada aksi korporasi baru putaran ini."
          else
            # Remote bisa saja sudah maju karena workflow harian. Rebase dulu.
            # Konflik JANGAN ditelan. Pola lama di sini `|| true` membuat
            # rebase yang bentrok tetap dianggap sukses, lalu langkah commit
            # berikutnya berhenti dengan "Committing is not possible because
            # you have unmerged files" dan seluruh putaran gagal dengan pesan
            # yang tidak menunjuk sebabnya. Terjadi pada run pasar 13 Agustus
            # 2026 pukul 10.59 UTC, keluar dengan kode 128.
            #
            # Yang benar: batalkan rebase, samakan paksa dengan remote, lalu
            # berhenti. Berkas yang dihasilkan putaran ini memang hilang, tapi
            # semuanya bisa dibuat ulang pada putaran berikutnya, sedangkan
            # repo yang setengah ter-rebase harus dibereskan tangan.
            git pull --rebase --autostash origin master || {
              echo "::error::Rebase bentrok dengan remote. Putaran ini dibatalkan; putaran berikutnya akan membuat ulang."
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/master
              exit 1
            }
          # DIPENTASKAN ULANG sesudah rebase, dan ini bukan kehati-hatian berlebihan.
          #
          # Urutannya `git add` LALU `git pull --rebase --autostash`. Autostash
          # menyimpan lalu memulihkan pohon kerja, dan pemulihan itu tidak menjamin
          # apa yang tadi terpentas masih terpentas. Berkas BARU tetap ikut, berkas
          # TERLACAK yang juga diubah remote bisa tidak ikut.
          #
          # Akibatnya terlihat pada commit 44deed4d8 (19 Agustus 2026): 21 berkas
          # masuk, 10 di antaranya halaman berita baru, tapi assets/js/articles.js
          # TIDAK ikut. Sepuluh artikel sungguhan terbit tanpa pernah masuk arsip,
          # lalu lima menit kemudian dihapus pembersih halaman yatim karena memang
          # tidak ada di daftar mana pun. Terbit dan mati dalam lima menit, tanpa
          # satu pun langkah berwarna merah.
          git add -A
            git commit -m "Aksi korporasi IDX: total ${{ steps.periksa.outputs.artikel }} artikel ($(date -u +'%Y-%m-%d %H:%M') UTC)" || true
            git push
          fi

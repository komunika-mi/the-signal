name: Perbarui data pasar

# Data pasar dulu cuma ikut job harian pukul 06.00 WIB, jadi angkanya membeku
# sepanjang hari dan stempel waktunya tertulis pagi padahal sudah sore.
#
# Job ini SENGAJA DI CLOUD, bukan di laptop. Yang diblokir Cloudflare hanya
# IDX; keempat sumber pasar (Yahoo Finance, open.er-api, gold-api, CoinGecko)
# semuanya bisa diakses dari mana saja asal permintaannya mengirim
# User-Agent browser, dan lib.mjs sudah mengirimnya. Terverifikasi 2026-08-12:
# tanpa User-Agent Yahoo membalas 429, dengan User-Agent 200.
#
# Jadi angka pasar tetap segar walau laptop mati.

# Jadwalnya bertingkat, bukan rata, karena dua alasan yang sama-sama nyata:
#
# 1. IHSG TIDAK BERGERAK di luar jam bursa. Memperbarui tiap 30 menit pukul
#    3 pagi cuma menyalin angka yang sama persis.
# 2. Repo ini privat, jadi menit GitHub Actions terhitung. Tiap 30 menit
#    nonstop = 1.440 run/bulan sekitar 2.880 menit, sementara kuota gratis
#    2.000 menit. Akan berhenti sendiri di tengah bulan.
#
# Susunan di bawah: 30 menit sekali saat bursa buka (yang memang diminta),
# 2 jam sekali di luar itu untuk USD/IDR dan Bitcoin yang tetap bergerak.
# Totalnya sekitar 590 run atau 1.200 menit per bulan, aman di dalam kuota.
on:
  schedule:
    # Diminta tiap 30 menit, 09.00-16.30 WIB, Senin-Jumat.
    #
    # YANG BENAR-BENAR TERJADI sekitar 5 putaran per sesi bursa, bukan 16.
    # Dihitung dari riwayat: Rabu 12 Agustus 2026 jalan pukul 04.21, 05.52,
    # 07.13, 08.44, dan 09.54 UTC. GitHub memang membatasi workflow berjadwal
    # pada saat beban tinggi, dan cron di sini adalah permintaan, bukan
    # jaminan. Memperapat cron TIDAK menolong karena batasnya di sisi mereka.
    #
    # Dibiarkan begini dengan sadar: 5 pembaruan per sesi masih cukup untuk
    # angka indikatif di bilah atas, dan situs ini memang tidak menjanjikan
    # harga waktu-nyata. Yang penting janjinya jujur, karena itu kalimat
    # "diperbarui tiap 30 menit" sudah dihapus dari halaman.
    - cron: "*/30 2-9 * * 1-5"
    - cron: "0 10,12,14,16,18,20,22,0 * * *"      # tiap 2 jam di luar jam bursa
  workflow_dispatch:

# Jangan bentrok dengan job harian maupun push dari penjadwal IDX di laptop.
concurrency:
  group: the-signal-tulis
  cancel-in-progress: false

jobs:
  pasar:
    runs-on: ubuntu-latest
    # Satu-satunya alur yang tadinya TANPA batas, dan itu mahal kalau nyangkut.
    #
    # Tanpa timeout-minutes, GitHub memakai bawaannya: 360 menit. Repo ini
    # privat, jadi menitnya terhitung, dan kuota gratisnya 2.000 menit per
    # bulan. Satu putaran yang menggantung saja menghabiskan 18 persen jatah
    # sebulan.
    #
    # 5 menit dipilih dari data, bukan ditebak: dua belas putaran terakhir
    # rata-rata 0,6 menit dan yang terlama 0,9 menit. Lima memberi ruang enam
    # kali lipat sambil tetap memotong jauh sebelum ongkosnya berarti.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sengaja tanpa npm install. Jalur pasar hanya memakai modul bawaan
      # Node, satu-satunya dependensi (@anthropic-ai/claude-agent-sdk) cuma
      # dipakai untuk merangkum berita dan tidak disentuh di sini. Ini bikin
      # tiap putaran selesai di bawah satu menit.
      - name: Selaraskan dengan origin sebelum membangun
        # WAJIB sebelum langkah apa pun yang membangkitkan berkas.
        #
        # actions/checkout mengambil SHA yang DIBEKUKAN saat putaran dibuat,
        # bukan saat job-nya mulai. Untuk putaran yang menunggu di antrean
        # concurrency, jarak keduanya bisa belasan menit dan putaran lain
        # sudah mendorong commit di sela itu. Membangun dari SHA basi lalu
        # menarik belakangan membuat tiap berkas hasil build punya dua versi,
        # dan autostash-nya bentrok. Terjadi pada Signal Mingguan 23 Agustus
        # 2026: ratusan berkas bentrok, edisinya tidak terbit dan tidak
        # terkirim ke pelanggan.
        #
        # Aman memakai reset --hard di sini, dan HANYA di sini: pohon kerjanya
        # masih hasil checkout murni, belum ada berkas dibangkitkan, jadi tidak
        # ada yang bisa hilang.
        timeout-minutes: 2
        run: |
          git fetch --quiet origin master
          git reset --hard origin/master
          echo "basis build: $(git rev-parse --short HEAD)"
      - name: Perbarui pasar dan bangun ulang
        run: node scripts/update-pasar.mjs

      - name: Commit dan push
        id: kirim
        run: |
          git config user.name "the-signal-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Angka pasar tidak berubah, tidak ada yang dikirim."
            echo "berubah=tidak" >> "$GITHUB_OUTPUT"
          else
            # Konflik JANGAN ditelan. Pola lama di sini `|| true` membuat
            # rebase yang bentrok tetap dianggap sukses, lalu langkah commit
            # berikutnya berhenti dengan "Committing is not possible because
            # you have unmerged files" dan seluruh putaran gagal dengan pesan
            # yang tidak menunjuk sebabnya. Terjadi pada run pasar 13 Agustus
            # 2026 pukul 10.59 UTC, keluar dengan kode 128.
            #
            # Yang benar: batalkan rebase, samakan paksa dengan remote, lalu
            # berhenti. Berkas yang dihasilkan putaran ini memang hilang, tapi
            # semuanya bisa dibuat ulang pada putaran berikutnya, sedangkan
            # repo yang setengah ter-rebase harus dibereskan tangan.
            git pull --rebase --autostash origin master || {
              echo "::error::Rebase bentrok dengan remote. Putaran ini dibatalkan; putaran berikutnya akan membuat ulang."
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/master
              exit 1
            }
            # JANGAN PERCAYA KODE KELUAR `git pull` DI ATAS.
            #
            # Kalau yang bentrok adalah AUTOSTASH-nya, git tetap keluar dengan kode 0.
            # Diuji sendiri pada repo kecil: "Applying autostash resulted in conflicts",
            # `git ls-files -u` berisi 3 berkas, dan kode keluar git pull tetap 0. Jadi
            # blok `|| { ... }` di atas TIDAK PERNAH menyala untuk kasus ini.
            #
            # Terjadi sungguhan 19 Agustus 2026 pada run 32240199637: log memuat
            # "Applying autostash resulted in conflicts" lalu "Committing is not
            # possible because you have unmerged files" dan keluar 128, sementara baris
            # "::error::Rebase bentrok dengan remote" yang disiapkan penjaga itu tidak
            # pernah tercetak.
            #
            # Yang diperiksa di sini KEADAAN pohon kerjanya, bukan kode keluarnya.
            if [ -n "$(git ls-files -u)" ]; then
              echo "::error::Autostash bentrok saat rebase. Putaran ini dibatalkan; putaran berikutnya akan membuat ulang."
              git ls-files -u | awk '{print $4}' | sort -u | head -20
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/master
              exit 1
            fi
          # DIPENTASKAN ULANG sesudah rebase, dan ini bukan kehati-hatian berlebihan.
          #
          # Urutannya `git add` LALU `git pull --rebase --autostash`. Autostash
          # JANGAN PERCAYA KODE KELUAR `git pull` DI ATAS.
          #
          # Kalau yang bentrok adalah AUTOSTASH-nya, git tetap keluar dengan kode 0.
          # Diuji sendiri pada repo kecil: "Applying autostash resulted in conflicts",
          # `git ls-files -u` berisi 3 berkas, dan kode keluar git pull tetap 0. Jadi
          # blok `|| { ... }` di atas TIDAK PERNAH menyala untuk kasus ini.
          #
          # Terjadi sungguhan 19 Agustus 2026 pada run 32240199637: log memuat
          # "Applying autostash resulted in conflicts" lalu "Committing is not
          # possible because you have unmerged files" dan keluar 128, sementara baris
          # "::error::Rebase bentrok dengan remote" yang disiapkan penjaga itu tidak
          # pernah tercetak.
          #
          # Yang diperiksa di sini KEADAAN pohon kerjanya, bukan kode keluarnya.
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Autostash bentrok saat rebase. Putaran ini dibatalkan; putaran berikutnya akan membuat ulang."
            git ls-files -u | awk '{print $4}' | sort -u | head -20
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/master
            exit 1
          fi
          # menyimpan lalu memulihkan pohon kerja, dan pemulihan itu tidak menjamin
          # apa yang tadi terpentas masih terpentas. Berkas BARU tetap ikut, berkas
          # TERLACAK yang juga diubah remote bisa tidak ikut.
          #
          # Akibatnya terlihat pada commit 44deed4d8 (19 Agustus 2026): 21 berkas
          # masuk, 10 di antaranya halaman berita baru, tapi assets/js/articles.js
          # TIDAK ikut. Sepuluh artikel sungguhan terbit tanpa pernah masuk arsip,
          # lalu lima menit kemudian dihapus pembersih halaman yatim karena memang
          # tidak ada di daftar mana pun. Terbit dan mati dalam lima menit, tanpa
          # satu pun langkah berwarna merah.
          git add -A
            git commit -m "Data pasar $(date -u -d '+7 hours' +'%Y-%m-%d %H:%M') WIB"
            git push
            echo "berubah=ya" >> "$GITHUB_OUTPUT"
          fi

      # Push sukses tidak sama dengan situs terbarui, sudah pernah terbukti
      # webhook Vercel diam. Kalau data pasar tidak sampai ke situs, justru
      # inilah keluhan yang mau kita perbaiki, jadi kegagalannya harus berisik.
      - name: Pastikan sampai ke situs
        if: steps.kirim.outputs.berubah == 'ya'
        run: |
          SITUS=$(node -e "import('./scripts/situs.mjs').then(m=>console.log(m.SITUS))")
          NILAI=$(node -e "const fs=require('fs');const s=fs.readFileSync('assets/js/market.js','utf8');console.log(JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1)).ihsg.nilai)")
          echo "menunggu IHSG $NILAI muncul di $SITUS"
          for i in $(seq 1 20); do
            if curl -s --max-time 20 "$SITUS/assets/js/market.js" | grep -qF "$NILAI"; then
              echo "terbit setelah ~$((i*15)) detik"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Data pasar sudah di-push tapi belum tampil di situs setelah 5 menit."
          echo "::error::Vercel kemungkinan tidak menerima webhook. Jalankan: npx vercel deploy --prod"
          exit 1

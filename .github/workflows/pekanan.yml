name: Signal Mingguan

# Edisi Minggu: pembacaan arah SEPEKAN, satu tingkat di atas edisi harian.
#
# KENAPA MINGGU, DAN KENAPA BUKAN HARIAN SAJA. Signal Harian sengaja tidak
# terbit Sabtu-Minggu karena bursa tutup dan lembaga tidak menerbitkan apa
# pun, jadi bahannya memang tidak ada. Tapi justru pada saat itulah bahan
# MINGGUAN baru lengkap: lima edisi harian sudah jadi, dan agenda pekan
# berikutnya sudah bisa dibaca dari dokumen resmi yang terbit sepanjang pekan.
#
# JAM 19.00 WIB, bukan 21.00 seperti edisi harian. Pembacanya sedang
# menyiapkan pekan kerja, jadi lebih berguna tiba sebelum malam, bukan
# menjelang tidur.
#
# JAM GANJIL DI UTC (12.00), dan itu disengaja. daily.yml berjalan tiap jam
# genap 23,1,3,...,15 UTC dan Task Scheduler IDX di komputer rumah juga tiap
# jam genap. Ketiganya menulis repo yang sama, dan grup concurrency GitHub
# tidak menyentuh penjadwal lokal, jadi tabrakan berarti satu push ditolak
# dan edisinya batal terbit. Pukul 12.00 UTC tidak ditempati siapa pun.
on:
  schedule:
    # Menit 25, bukan 0; alasan menghindari menit 0 ada di daily.yml. Menit 7
    # sempat dipakai dan ditolak simulasi 24 jam: pasar.yml jalan di menit 9,
    # tepat di tengah edisi ini, padahal berbagi grup concurrency
    # the-signal-tulis. Menit 25 jatuh di sela kosong antara pasar :09 dan
    # idx :43. Catatan di atas soal "pukul 12.00 UTC tidak ditempati siapa
    # pun" masih berlaku: yang berubah cuma menitnya.
    - cron: "25 12 * * 0"
  workflow_dispatch:
    inputs:
      hanya_kirim:
        description: "Kirim edisi yang SUDAH ada, jangan menulis ulang"
        type: boolean
        default: false

concurrency:
  group: the-signal-tulis       # sama dengan daily, harian, dan idx
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tulis:
    runs-on: ubuntu-latest
    # Jatah job jadi jaring TERAKHIR, bukan yang pertama menyala.
    #
    # Putaran sehat 0,5 sampai 0,6 menit. Tapi selama tidak ada satu pun pagar di
    # tingkat langkah, yang selalu jatuh duluan adalah jatah job, dan job yang
    # ditebas berakhir "cancelled" yang TIDAK dikirimi email GitHub. Untuk alur
    # yang mengirim email ke pelanggan, gagal tanpa kabar berarti pembaca tidak
    # menerima edisinya dan tidak ada seorang pun yang tahu.
    #
    # Sekarang tiap langkah berpagar, berjumlah 41 menit (dihitung ulang dari
    # nilai timeout-minutes di berkas ini, bukan disalin dari catatan lama -
    # angka 37 yang tertulis di sini sebelumnya sudah usang).
    #
    # 42 -> 45 pada 4 September 2026, mengikuti "Pasang dependensi" 4 -> 6.
    # Tanpa ini jaraknya tinggal 1 menit, dan jarak setipis itu membuat
    # jaminan di atas rapuh: satu langkah tambahan di kemudian hari langsung
    # membalik urutan jatuhnya tanpa ada yang sadar.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # --prefer-offline: waktunya habis di registry, bukan di pemasangan.
      # Diukur 4 September 2026: npm ci polos 321 detik, dengan flag ini 13
      # detik, pohon node_modules identik. Alasan lengkapnya di daily.yml.
      - name: Pasang dependensi
        timeout-minutes: 6
        run: npm ci --prefer-offline --no-audit --no-fund

      # Mode kirim-ulang. Dipakai kalau edisinya sudah ada dan benar tapi
      # pengirimannya gagal atau tertinggal, misalnya jadwal Minggu terlewat
      # atau langkah Telegram jatuh. Tanpa mode ini satu-satunya cara memicu
      # pengiriman adalah menjalankan seluruh workflow, yang akan MENULIS ULANG
      # edisinya dengan jendela tanggal hari itu dan menimpa edisi yang sudah
      # benar. Di sini edisinya dibiarkan apa adanya, hanya dikirim.
      - name: Selaraskan dengan origin sebelum membangun
        # WAJIB sebelum langkah apa pun yang membangkitkan berkas.
        #
        # actions/checkout mengambil SHA yang DIBEKUKAN saat putaran dibuat,
        # bukan saat job-nya mulai. Untuk putaran yang menunggu di antrean
        # concurrency, jarak keduanya bisa belasan menit dan putaran lain
        # sudah mendorong commit di sela itu. Membangun dari SHA basi lalu
        # menarik belakangan membuat tiap berkas hasil build punya dua versi,
        # dan autostash-nya bentrok. Terjadi pada Signal Mingguan 23 Agustus
        # 2026: ratusan berkas bentrok, edisinya tidak terbit dan tidak
        # terkirim ke pelanggan.
        #
        # Aman memakai reset --hard di sini, dan HANYA di sini: pohon kerjanya
        # masih hasil checkout murni, belum ada berkas dibangkitkan, jadi tidak
        # ada yang bisa hilang.
        timeout-minutes: 2
        run: |
          git fetch --quiet origin master
          git reset --hard origin/master
          echo "basis build: $(git rev-parse --short HEAD)"
      - name: Mode kirim-ulang
        timeout-minutes: 2
        if: ${{ inputs.hanya_kirim }}
        run: |
          EDISI=$(node -e "const fs=require('fs');const m=fs.readFileSync('assets/js/pekanan.js','utf8').match(/\"tanggal\":\s*\"([^\"]+)\"/);console.log(m?m[1]:'')")
          if [ -z "$EDISI" ]; then
            echo "::error::pekanan.js tidak punya tanggal. Tidak ada edisi untuk dikirim."
            exit 1
          fi
          echo "TERBIT=ya" >> $GITHUB_ENV
          echo "EDISI=$EDISI" >> $GITHUB_ENV
          echo "Kirim ulang edisi $EDISI tanpa menulis ulang."

      - name: Tulis Signal Mingguan
        timeout-minutes: 10
        if: ${{ !inputs.hanya_kirim }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIGNAL_MODEL: claude-sonnet-5
        run: node scripts/signal-pekanan.mjs

      - name: Commit dan push
        timeout-minutes: 4
        if: ${{ !inputs.hanya_kirim }}
        run: |
          git config user.name "the-signal-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan. Pekan ini kemungkinan terlalu sepi untuk"
            echo "ditarik polanya, dan itu wajar. Pekan yang sepi memang ada,"
            echo "dan mengaku lebih baik daripada mengarang pola."
            echo "TERBIT=tidak" >> $GITHUB_ENV
            exit 0
          fi
          echo "TERBIT=ya" >> $GITHUB_ENV
          EDISI=$(node -e "const fs=require('fs');const m=fs.readFileSync('assets/js/pekanan.js','utf8').match(/\"tanggal\":\s*\"([^\"]+)\"/);console.log(m?m[1]:'')")
          echo "EDISI=$EDISI" >> $GITHUB_ENV
          git commit -m "Signal Mingguan $EDISI"
          # Rebase dulu: putaran berita atau pasar bisa mendorong commit di
          # sela penulisan. Konflik TIDAK ditelan; edisi bisa dijalankan ulang
          # lewat workflow_dispatch.
          git pull --rebase --autostash origin master || {
            echo "::error::Rebase bentrok. Jalankan ulang setelah putaran lain selesai."
            git rebase --abort 2>/dev/null || true
            exit 1
          }
          # JANGAN PERCAYA KODE KELUAR `git pull` DI ATAS.
          #
          # Kalau yang bentrok adalah AUTOSTASH-nya, git tetap keluar dengan kode 0.
          # Diuji sendiri pada repo kecil: "Applying autostash resulted in conflicts",
          # `git ls-files -u` berisi 3 berkas, dan kode keluar git pull tetap 0. Jadi
          # blok `|| { ... }` di atas TIDAK PERNAH menyala untuk kasus ini.
          #
          # Terjadi sungguhan 19 Agustus 2026 pada run 32240199637: log memuat
          # "Applying autostash resulted in conflicts" lalu "Committing is not
          # possible because you have unmerged files" dan keluar 128, sementara baris
          # "::error::Rebase bentrok dengan remote" yang disiapkan penjaga itu tidak
          # pernah tercetak.
          #
          # Yang diperiksa di sini KEADAAN pohon kerjanya, bukan kode keluarnya.
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Autostash bentrok saat rebase. Putaran ini dibatalkan; putaran berikutnya akan membuat ulang."
            git ls-files -u | awk '{print $4}' | sort -u | head -20
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/master
            exit 1
          fi
          git push

      - name: Tunggu situs benar-benar tayang
        timeout-minutes: 8
        run: |
          # HARUS sebelum pengiriman. Email memuat tautan "baca di situs", dan
          # email tidak bisa ditarik kembali; kalau dikirim sebelum deploy
          # selesai, pelanggan mengklik menuju halaman yang belum ada.
          if [ "$TERBIT" = "tidak" ]; then
            echo "Tidak ada edisi pekan ini, tidak ada yang perlu ditunggu."
            exit 0
          fi
          if [ -z "$EDISI" ]; then
            echo "::error::EDISI kosong padahal ada edisi yang di-commit."
            exit 1
          fi
          for i in $(seq 1 20); do
            sleep 15
            # Yang diperiksa GUID EDISI INI di feed, bukan sekadar halamannya
            # membalas 200. signal-mingguan.html sudah ada sejak edisi minggu
            # lalu, jadi memeriksa 200 saja adalah gerbang yang selalu terbuka.
            if curl -sf --max-time 20 https://the-signal.id/feed.xml | grep -q "the-signal-pekanan-$EDISI"; then
              echo "Situs dan feed sudah tayang."
              exit 0
            fi
          done
          echo "::error::Situs tidak tayang setelah 5 menit. Pengiriman dibatalkan."
          exit 1

      - name: Kirim ke pelanggan
        timeout-minutes: 5
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ "$TERBIT" = "tidak" ]; then
            echo "Tidak ada edisi pekan ini, tidak ada email yang dikirim."
            exit 0
          fi
          # Kunci edisi pekanan berawalan "pekan-", terpisah dari edisi harian,
          # supaya keduanya tidak saling menutup lewat penjaga anti-ganda.
          node scripts/kirim-harian.mjs --pekanan

      - name: Kirim ke kanal Telegram
        continue-on-error: true
        timeout-minutes: 4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          if [ "$TERBIT" = "tidak" ]; then
            echo "Tidak ada edisi pekan ini, tidak ada kiriman Telegram."
            exit 0
          fi
          node scripts/kirim-telegram.mjs --pekanan
          # State anti-ganda hidup di repo. Tanpa commit ini, putaran Minggu
          # depan tidak tahu edisi ini sudah terkirim.
          if ! git diff --quiet scripts/telegram-kirim.json; then
            git config user.name "the-signal-bot"
            git config user.email "actions@github.com"
            git add scripts/telegram-kirim.json
            git commit -m "Catat kiriman Telegram pekanan $EDISI"
            git pull --rebase --autostash origin master || {
              git rebase --abort 2>/dev/null || true
              echo "::error::Rebase bentrok saat mencatat state Telegram."
              exit 1
            }
            # JANGAN PERCAYA KODE KELUAR `git pull` DI ATAS.
            #
            # Kalau yang bentrok adalah AUTOSTASH-nya, git tetap keluar dengan kode 0.
            # Diuji sendiri pada repo kecil: "Applying autostash resulted in conflicts",
            # `git ls-files -u` berisi 3 berkas, dan kode keluar git pull tetap 0. Jadi
            # blok `|| { ... }` di atas TIDAK PERNAH menyala untuk kasus ini.
            #
            # Terjadi sungguhan 19 Agustus 2026 pada run 32240199637: log memuat
            # "Applying autostash resulted in conflicts" lalu "Committing is not
            # possible because you have unmerged files" dan keluar 128, sementara baris
            # "::error::Rebase bentrok dengan remote" yang disiapkan penjaga itu tidak
            # pernah tercetak.
            #
            # Yang diperiksa di sini KEADAAN pohon kerjanya, bukan kode keluarnya.
            if [ -n "$(git ls-files -u)" ]; then
              echo "::error::Autostash bentrok saat rebase. Putaran ini dibatalkan; putaran berikutnya akan membuat ulang."
              git ls-files -u | awk '{print $4}' | sort -u | head -20
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/master
              exit 1
            fi
            git push
          fi

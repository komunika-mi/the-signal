name: Pemantau kesehatan situs

# SATU-SATUNYA workflow yang boleh berstatus MERAH tanpa ada yang rusak di
# penerbitan. Tugasnya memang cuma berteriak.
#
# Kenapa terpisah dari daily.yml. Penjaga di dalam pipeline penerbitan sengaja
# dibuat peringatan, bukan penghenti, karena satu foto bermasalah tidak boleh
# menahan seluruh berita. Pelajaran mahal dari 13 Agustus 2026 ketika penjaga
# keras menahan situs seharian.
#
# Tapi peringatan di dalam run yang berstatus sukses TIDAK TERLIHAT SIAPA PUN
# kecuali ada yang membuka tab Actions. Audit 14 Agustus 2026 menghitung empat
# kegagalan job dalam dua hari dan NOL pemberitahuan keluar. Tiga kerusakan
# besar berturut-turut ditemukan pemilik situs sendiri, bukan oleh sistemnya:
# ffmpeg hilang di runner, pdftotext tak ketemu, dan Signal+ tidak pernah
# mengirim satu email pun sejak dibuka.
#
# Job ini memisahkan kedua kebutuhan itu. Penerbitan tetap berjalan apa pun
# yang terjadi, sementara job ini gagal dengan berisik supaya GitHub mengirim
# pemberitahuan bawaannya ke pemilik repo. Tidak perlu secret baru, tidak perlu
# bot, dan tidak ada satu pun berita yang tertahan karenanya.

on:
  schedule:
    # 08.00, 14.00, dan 21.00 WIB. Tiga kali sehari cukup: yang diukur di sini
    # kerusakan berskala jam sampai hari, bukan detik. Lebih sering justru
    # melatih orang mengabaikan pemberitahuannya.
    # Menit 23, bukan 0; alasannya di daily.yml. Sengaja jauh dari menit 17
    # (daily) dan 43 (idx) supaya pemeriksaan tidak berjalan tepat saat situs
    # sedang dibangun ulang - hasil pemeriksaan atas berkas setengah terbit
    # akan merah tanpa ada yang benar-benar rusak.
    - cron: "23 1,7,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pantau:
    runs-on: ubuntu-latest
    # 20 menit, naik dari 12. Bukan karena pemeriksaannya melambat, tapi
    # karena tiap langkah kini punya pagarnya sendiri: 4 (ffmpeg) + 8
    # (foto) + 5 (SEO) + sisanya kecil-kecil. Jatah job tinggal jadi
    # jaring pengaman terakhir, bukan yang pertama kena.
    # 20 -> 28. Pagar per langkah berjumlah 23 menit, jadi jatah 20
    # akan menyala LEBIH DULU daripada pagar langkahnya. Itu justru keadaan
    # yang dihindari: job yang ditebas berakhir "cancelled" tanpa email,
    # sedangkan langkah yang ditebas berakhir "failure" yang mengirim email.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # --prefer-offline: waktunya habis di registry, bukan di pemasangan.
      # Alur ini tercatat 145 detik pada 4 September 2026, normalnya 5-6.
      # Diukur: npm ci polos 321 detik, dengan flag ini 13 detik, pohon
      # node_modules identik. Alasan lengkapnya di daily.yml.
      #
      # Langkah ini SENGAJA tanpa pagar sendiri, mengikuti gaya berkas ini
      # yang menyerahkannya ke jatah job.
      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Kesegaran tiap kanal berita
        id: kanal
        run: |
          # Kanal yang biasanya berbunyi lalu diam sekian lama itu bukan sepi,
          # itu tanda rusak. Ambangnya per kanal, lihat scripts/periksa-kanal.mjs.
          node scripts/periksa-kanal.mjs

      - name: Situs benar-benar hidup dan segar
        if: always()
        run: |
          SITUS=https://the-signal.id
          gagal=0

          for u in / /berita.html /signal-harian.html /data-ekonomi.html /tentang.html \
                   /agenda.html /rapor.html /tema.html /emiten.html; do
            KODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$SITUS$u")
            if [ "$KODE" != "200" ]; then
              echo "::error::$u membalas HTTP $KODE"
              gagal=1
            fi
          done

          # Beranda harus memuat berita sungguhan, bukan kerangka kosong.
          # Sejak beranda dipanggang saat build, HTML-nya wajib berisi tautan
          # artikel. Kalau nol, panggangnya gagal dan tidak ada yang tahu.
          TAUTAN=$(curl -s --max-time 25 "$SITUS/" | grep -o 'href="/berita/[a-z0-9-]*\.html"' | sort -u | wc -l)
          echo "tautan artikel di beranda: $TAUTAN"
          if [ "$TAUTAN" -lt 10 ]; then
            echo "::error::Beranda cuma memuat $TAUTAN tautan artikel, seharusnya belasan. Panggang beranda kemungkinan gagal."
            gagal=1
          fi

          # Panel Signal Harian adalah bagian yang menjual. Kalau hilang dari
          # beranda, produknya kembali terlihat seperti agregator berita biasa.
          if ! curl -s --max-time 25 "$SITUS/" | grep -q 'sinyal-panel'; then
            echo "::error::Panel Signal Harian tidak ada di beranda."
            gagal=1
          fi

          exit $gagal

      - name: Newsletter Signal+ benar-benar mengirim
        if: always()
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          # Diperiksa karena pernah diam total tanpa ada yang sadar. Dua edisi
          # ditulis dan tayang di situs, nol email sampai ke pelanggan, selama
          # itu beranda menjanjikan kiriman tiap sore hari kerja.
          if [ -z "$BUTTONDOWN_API_KEY" ]; then
            echo "::warning::BUTTONDOWN_API_KEY tidak tersedia, pemeriksaan newsletter dilewati"
            exit 0
          fi
          TERKIRIM=$(curl -s --max-time 25 \
            -H "Authorization: Token $BUTTONDOWN_API_KEY" \
            'https://api.buttondown.com/v1/emails?status=sent' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).count??0)}catch{console.log(-1)}})")
          echo "email berstatus terkirim: $TERKIRIM"
          if [ "$TERKIRIM" = "-1" ]; then
            echo "::error::Tidak bisa membaca daftar email Buttondown."
            exit 1
          fi
          if [ "$TERKIRIM" -eq 0 ]; then
            echo "::error::Buttondown belum pernah mengirim satu email pun, padahal situs menjanjikan kiriman tiap sore hari kerja."
            exit 1
          fi

      - name: Mesin pencari dan mesin jawab masih bisa membaca situs
        if: always()
        timeout-minutes: 5
        run: |
          # Yang diperiksa BUKAN peringkat, melainkan apakah pintunya masih
          # terbuka: robots.txt, dua sitemap, data terstruktur di beranda dan
          # di artikel TERBARU, llms.txt, dan feed. Semuanya hal yang bisa
          # rusak sesudah build tanpa meninggalkan jejak apa pun di repo, dan
          # tidak satu pun terlihat oleh mata pada halaman yang tampak normal.
          #
          # if: always() supaya langkah ini tetap jalan walau pemeriksaan di
          # atasnya sudah merah. Kerusakan SEO dan kerusakan isi tidak saling
          # menggantikan, dan menyembunyikan yang satu di balik yang lain
          # persis cara sebuah masalah bertahan berminggu-minggu.
          node scripts/periksa-seo.mjs

      # ffmpeg dipasang di langkah TERPISAH supaya waktu unduh apt tidak
      # ikut terhitung ke dalam timeout pemeriksaan fotonya sendiri.
      - name: Siapkan ffmpeg
        if: always()
        timeout-minutes: 10
        run: |
          # `apt-get update` sendirian pernah makan lebih dari empat menit,
          # karena ia menarik SELURUH indeks repositori padahal yang
          # dibutuhkan satu paket. Jadi urutannya: pakai yang sudah ada,
          # kalau tidak ada pasang tanpa update dulu, update cuma kalau
          # pemasangan polos itu benar-benar gagal.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg sudah tersedia: $(ffmpeg -version | head -1)"
            exit 0
          fi
          sudo apt-get install -y -q -o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 ffmpeg \
            || { sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 && sudo apt-get install -y -q -o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 ffmpeg; }
          ffmpeg -version | head -1

      # DIPAGARI TIMEOUT SENDIRI, dan sengaja ditaruh PALING AKHIR.
      #
      # 19 Agustus 2026 langkah ini makan 16,6 menit, padahal pekan
      # sebelumnya cuma 1,6 menit. Karena job hanya berjatah 12 menit,
      # seluruh run dibunuh sebagai "cancelled", dan pemeriksaan SEO yang
      # waktu itu berada di bawahnya ikut ter-skip meski sudah ber-if:
      # always(): job yang di-cancel merobohkan langkah sesudahnya, dan
      # always() tidak menolong.
      #
      # Dua akibat yang sama buruknya. Pemeriksaannya tidak jalan, DAN
      # pemiliknya tidak diberi tahu, karena run "cancelled" tidak
      # diperlakukan GitHub seperti run merah.
      #
      # timeout-minutes di tingkat LANGKAH mengubah keduanya: yang mati
      # cuma langkah ini, ia tercatat GAGAL sehingga job jadi merah dan
      # emailnya terkirim, sedangkan langkah lain tetap jalan sampai habis.
      - name: Foto artikel cocok dengan sumbernya
        if: always()
        timeout-minutes: 8
        run: |
          # Sampel saja, bukan seluruh arsip: yang dicari kerusakan BARU, dan
          # arsip lama sudah diperiksa penuh saat perbaikannya dikerjakan.
          node scripts/periksa-foto.mjs 15

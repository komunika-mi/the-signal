name: Probe IDX dari runner

# Menguji APAKAH IDX masih memblokir IP pusat data GitHub, tanpa mengubah
# apa pun. Dibuat 14 Agustus 2026 karena klaim "IDX memblokir runner" sudah
# beberapa hari umurnya dan pantas diperiksa ulang sebelum dipakai sebagai
# alasan menjalankan pipeline di komputer rumah.
#
# Jalankan manual lewat tab Actions. Tidak berjadwal, tidak menulis apa pun,
# tidak butuh secret.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    # 20 -> 32. Pagar per langkah berjumlah 27 menit, jadi jatah 20
    # akan menyala LEBIH DULU daripada pagar langkahnya. Itu justru keadaan
    # yang dihindari: job yang ditebas berakhir "cancelled" tanpa email,
    # sedangkan langkah yang ditebas berakhir "failure" yang mengirim email.
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4


      - name: Uji jangkauan IDX
        timeout-minutes: 6
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          REF='https://www.idx.co.id/id/perusahaan-tercatat/keterbukaan-informasi/'
          API='https://www.idx.co.id/primary/ListedCompany/GetAnnouncement?indexFrom=1&pageSize=5&dateFrom=&dateTo=&lang=id&keyword=&emitenType=*'

          echo "===== 1. IP keluar runner ====="
          curl -s --max-time 15 https://api.ipify.org; echo

          echo
          echo "===== 2. Halaman biasa IDX (HTML) ====="
          KODE=$(curl -s -o /tmp/idx-html.txt -w '%{http_code}' --max-time 25 -A "$UA" "$REF")
          echo "HTTP $KODE, ukuran $(wc -c < /tmp/idx-html.txt) byte"
          head -c 160 /tmp/idx-html.txt; echo

          echo
          echo "===== 3. API pengumuman (JSON) ====="
          KODE=$(curl -s -o /tmp/idx-api.txt -w '%{http_code}' --max-time 30 \
            -A "$UA" \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Accept-Language: id-ID,id;q=0.9,en;q=0.8' \
            -H "Referer: $REF" \
            -c /tmp/ck.txt -b /tmp/ck.txt \
            "$API")
          echo "HTTP $KODE, ukuran $(wc -c < /tmp/idx-api.txt) byte"
          echo "160 karakter pertama:"
          head -c 160 /tmp/idx-api.txt; echo
          if head -c 1 /tmp/idx-api.txt | grep -q '{'; then
            echo "-> JSON. Jumlah Replies: $(node -e "
              try{const j=JSON.parse(require('fs').readFileSync('/tmp/idx-api.txt','utf8'));
              console.log(Array.isArray(j.Replies)?j.Replies.length:'TIDAK ADA field Replies');}catch(e){console.log('parse gagal');}
            ")"
          else
            echo "-> BUKAN JSON, kemungkinan halaman tantangan Cloudflare"
          fi

          echo
          echo "===== 4. Panaskan sesi dulu, lalu API lagi ====="
          curl -s -o /dev/null --max-time 25 -A "$UA" -c /tmp/ck2.txt "$REF"
          sleep 3
          KODE=$(curl -s -o /tmp/idx-api2.txt -w '%{http_code}' --max-time 30 \
            -A "$UA" -H 'Accept: application/json, text/plain, */*' \
            -H "Referer: $REF" -c /tmp/ck2.txt -b /tmp/ck2.txt "$API")
          echo "HTTP $KODE, ukuran $(wc -c < /tmp/idx-api2.txt) byte, awalan: $(head -c 40 /tmp/idx-api2.txt)"

          echo
          echo "===== 5. Skrip asli kita ====="
          node -e "
            import('./scripts/lib.mjs').then(async m=>{
              try{
                const j = await m.ambilIDX('$API');
                console.log('BERHASIL, laporan: ' + (j.Replies ? j.Replies.length : '?'));
              }catch(e){ console.log('GAGAL: ' + String(e.message).slice(0,140)); }
            });
          "

          echo

      # Domain resmi IDX yang KEDUA, dan uji penentunya.
      #
      # www.idx.id menyajikan API yang sama persis (ResultCount identik dari
      # mesin rumah), dan dari jaringan pusat data LAIN ia dilayani 200
      # sementara idx.co.id dibalas 403. Tapi itu pusat data dengan reputasi
      # ASN yang berbeda. Yang menentukan bagi kita cuma satu jaringan:
      # runner GitHub. Inilah ujinya, dan sebelum ini dijalankan klaim
      # "masalahnya selesai" belum berdiri sama sekali.
      #
      # Kehati-hatian yang harus ikut tercatat: sertifikat idx.id cuma DV
      # (CN=idx.id, Google Trust Services), sedangkan idx.co.id OV dengan
      # O=PT BURSA EFEK INDONESIA. Kepemilikan idx.id TIDAK terbukti dari
      # sertifikatnya. Uji ini menjawab "bisa dijangkau?", bukan "layak
      # disitir sebagai sumber di artikel?". Dua pertanyaan berbeda, dan yang
      # kedua lebih penting bagi sebuah media.
      - name: Uji domain kedua www.idx.id
        if: always()
        timeout-minutes: 6
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          Q='indexFrom=1&pageSize=3&dateFrom=&dateTo=&lang=id&keyword=&emitenType=*'
          for H in www.idx.co.id www.idx.id; do
            echo "===== $H ====="
            KODE=$(curl -s -o /tmp/d.json -w '%{http_code}' --max-time 25 -A "$UA" -H 'Accept: application/json, text/plain, */*' "https://$H/primary/ListedCompany/GetAnnouncement?$Q")
            echo "HTTP $KODE, $(wc -c < /tmp/d.json) byte"
            head -c 110 /tmp/d.json; echo
            node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/d.json','utf8'));console.log('-> JSON. ResultCount='+j.ResultCount+' Replies='+(j.Replies||[]).length);}catch(e){console.log('-> BUKAN JSON, kemungkinan halaman tantangan');}"
            echo
          done
          echo "===== sertifikat ====="
          for H in www.idx.co.id www.idx.id; do
            echo -n "$H  "
            echo | openssl s_client -servername "$H" -connect "$H":443 2>/dev/null | openssl x509 -noout -subject 2>/dev/null
          done
          exit 0
      # poppler dipasang SESUDAH uji jangkauan, bukan sebelum.
      #
      # 19 Agustus 2026 urutannya terbalik dan `apt-get update` menghabiskan
      # 10,1 menit sampai menembus jatah job. Uji IDX-nya, satu-satunya alasan
      # probe ini ada, ikut ter-skip. Pemasangan paket tidak boleh berdiri di
      # depan pemeriksaan yang tidak membutuhkannya: bagian 1 sampai 5 cuma
      # perlu curl dan node.
      #
      # `apt-get update` juga tidak lagi dijalankan lebih dulu. Ia menarik
      # seluruh indeks repositori demi satu paket.
      - name: Pasang poppler-utils untuk membaca lampiran
        if: always()
        timeout-minutes: 10
        run: |
          command -v pdftotext >/dev/null 2>&1 && { pdftotext -v; exit 0; }
          sudo apt-get install -y -q -o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 poppler-utils || { sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 && sudo apt-get install -y -q -o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 poppler-utils; }
          pdftotext -v

      # Dijadikan langkah TERSENDIRI supaya kegagalan membaca PDF tidak
      # mengaburkan hasil uji jangkauannya sendiri, dan supaya pemasangan
      # poppler tidak lagi berdiri di depan pintu.
      # Alamat lampiran diambil dari API www.idx.id, BUKAN /tmp/idx-api.txt.
      #
      # Versi sebelumnya membaca berkas itu dan menempelkan awalan
      # 'https://www.idx.co.id' di depan FullSavePath. Dua-duanya keliru:
      # berkas itu berisi halaman 403 Cloudflare (jadi tak pernah ada
      # lampiran untuk diuji), dan FullSavePath sudah absolut sehingga
      # penempelan itu menghasilkan alamat ganda. Akibatnya bagian 6 selalu
      # mencetak "tidak ada lampiran PDF untuk diuji" dan tidak pernah
      # benar-benar menguji apa pun.
      #
      # Yang ditanyakan di sini persis pertanyaan yang menjatuhkan idx.yml
      # 30 Agustus 2026: unduhan lampiran gagal dengan sebab "galat" (curl
      # keluar tidak nol), bukan "diblokir" (yang turun HTML). Karena itu
      # flag curl-nya disamakan HURUF PER HURUF dengan ambilIsiLampiran di
      # scripts/fetch-idx.mjs, dan yang dicetak adalah kode keluar serta
      # stderr-nya - dua hal yang di skrip aslinya terpotong di 60 karakter
      # dan justru menyembunyikan sebabnya.
      - name: Uji lampiran PDF
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          REF='https://www.idx.co.id/id/perusahaan-tercatat/keterbukaan-informasi/'
          Q='indexFrom=0&pageSize=10&dateFrom=&dateTo=&lang=id&keyword=&emitenType=*'

          echo "===== 6. Cari alamat lampiran lewat www.idx.id ====="
          curl -s -o /tmp/api-id.json --max-time 30 -A "$UA" \
            -H 'Accept: application/json, text/plain, */*' \
            "https://www.idx.id/primary/ListedCompany/GetAnnouncement?$Q"
          ASLI=$(grep -oE '"FullSavePath":"[^"]*\.pdf"' /tmp/api-id.json \
                 | head -1 | sed 's/"FullSavePath":"//; s/"$//')
          echo "FullSavePath apa adanya : ${ASLI:-(tidak ada)}"
          if [ -z "$ASLI" ]; then echo "API idx.id tidak memberi lampiran PDF"; exit 0; fi

          # Penulisan ulang host yang sama dengan untukDiambil() di fetch-idx.mjs.
          MIRROR=$(echo "$ASLI" | sed 's|^https://www\.idx\.co\.id|https://www.idx.id|')
          echo "alamat yang dipakai skrip: $MIRROR"

          echo
          echo "===== 7. Unduh lampiran, flag PERSIS seperti fetch-idx.mjs ====="
          for U in "$ASLI" "$MIRROR"; do
            echo "--- $U"
            curl -s -L --compressed --max-time 45 -A "$UA" \
              -H 'Accept: application/pdf,*/*' \
              -H 'Accept-Language: id-ID,id;q=0.9,en;q=0.8' \
              -H "Referer: $REF" \
              -o /tmp/l.pdf "$U" 2>/tmp/l.err
            KODE=$?
            echo "    curl keluar : $KODE"
            echo "    stderr      : $(head -c 200 /tmp/l.err)"
            if [ -f /tmp/l.pdf ]; then
              echo "    ukuran      : $(wc -c < /tmp/l.pdf) byte"
              echo "    awalan      : $(head -c 5 /tmp/l.pdf | tr -d '\0')"
            else
              echo "    berkas      : tidak terbentuk"
            fi
            echo
          done

          echo "===== 8. HTTP mentah tiap host untuk StaticData ====="
          for H in www.idx.co.id www.idx.id; do
            P=$(echo "$ASLI" | sed "s|^https://www\.idx\.co\.id|https://$H|")
            echo "$H -> $(curl -s -o /dev/null -w 'HTTP %{http_code} %{size_download} byte' --max-time 30 -A "$UA" -H "Referer: $REF" "$P")"
          done
          exit 0
